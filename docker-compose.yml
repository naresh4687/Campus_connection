# Local development services only. Credentials here are throwaway dev values.
name: campusconnect
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev_superuser_pw}
      CC_OWNER_PASSWORD: ${CC_OWNER_PASSWORD:-dev_owner_pw}
      CC_APP_PASSWORD: ${CC_APP_PASSWORD:-dev_app_pw}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for private documents (development only; credentials are throwaway).
  # RustFS was chosen on 2026-11-12 after MinIO's images became unpullable (see TECHNICAL_DECISIONS TD-08).
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-dev_storage_access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-dev_storage_secret_key}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storagedata:/data

volumes:
  pgdata:
  storagedata:
